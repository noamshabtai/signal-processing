base:
  tested:
    nfft: 512
    sampling_frequency: 16000
    hrtf:
      dtype: complex64
    azimuth:
      symmetric: True
      span: 90
      resolution: 10
    elevation:
      span: 30
      resolution: 10

cases:
  - name: binaural
    tested:
      initial_azimuth: [0.0, 90.0, 180.0]
      initial_elevation: [0.0, 0.0, 0.0]
    test:
      orientation:
        yaw: 90.0
        pitch: 0.0
        roll: 0.0
      expected:
        azimuth: [270.0, 0.0, 90.0]
        elevation: [-0.0, -0.0, -0.0]
      mode: binaural

  - name: stereo
    tested:
      initial_azimuth: [0.0, 45.0, 90.0]
      initial_elevation: [30.0, 45.0, 60.0]
    test:
      orientation:
        yaw: 0.0
        pitch: 30.0
        roll: 0.0
      expected:
        azimuth: [0.0, 32.44, 49.11]
        elevation: [0.0, 21.25, 48.59]
      mode: stereo

  - name: mono
    tested:
      initial_azimuth: [270.0, 0.0, 90.0]
      initial_elevation: [-45.0, -30.0, -15.0]
    test:
      orientation:
        yaw: 0.0
        pitch: -30.0
        roll: 0.0
      expected:
        azimuth: [296.57, 0.0, 82.37]
        elevation: [-37.76, -0.0, -12.95]
      mode: mono

  - name: combined_orientation
    tested:
      initial_azimuth: [0.0, 45.0, 90.0]
      initial_elevation: [0.0, 20.0, -20.0]
    test:
      orientation:
        yaw: 30.0
        pitch: 20.0
        roll: 15.0
      expected:
        azimuth: [333.47, 13.46, 70.39]
        elevation: [-24.55, 4.22, -14.78]
      mode: binaural

  - name: roll
    tested:
      initial_azimuth: [0.0, 90.0, 180.0]
      initial_elevation: [0.0, 0.0, 0.0]
    test:
      orientation:
        yaw: 0.0
        pitch: 0.0
        roll: 15.0
      expected:
        azimuth: [0.0, 90.0, 180.0]
        elevation: [0.0, 15.0, 0.0]
      mode: binaural
