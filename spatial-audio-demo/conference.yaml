demo:
  initial_gain_db: [-10.0, -10.0, -10.0]
system:
  input_buffer:
    channel_shape: [3]
    step_size: 128
    buffer_size: 512
    dtype: int16
  analysis: {}
  synthesis:
    output_buffer:
      dtype: float32
  spatial_audio:
    nfft: 512
    sampling_frequency: 8000
    initial_azimuth: [0.0, 10.0, -10.0]
    initial_elevation: [10.0, 10.0, 10.0]
    hrtf:
      dtype: complex64
      nfft: 512
      sampling_frequency: 8000
      path: ../spatial-audio/hrtf/hrtf_16khz_low_res.bin
      equalization: true
      gain_db: 3.0
    azimuth:
      symmetric: True
      span: 90
      resolution: 10
    elevation:
      span: 30
      resolution: 10
input: # Input configuration for DemoActivator
  source: file
  path: conference_input.wav # generated by scripts/create_input.py
output:
  destination: speaker
  dtype: int16 # Assuming float32 output from the system
  channel_shape: [2] # Stereo output for binaural audio
