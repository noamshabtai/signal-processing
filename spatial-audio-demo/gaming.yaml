demo:
  # -20log10(6), the headroom the six channels need when summed. The game bed comes in at the same gain as the
  # squad: its own mix already keeps the gunfire under the callouts, which is the balance a player would set.
  initial_gain_db: [-5.0, -5.0, -5.0, -5.0, -5.0, 0.0]
system:
  input_buffer:
    channel_shape: [6]
    step_size: 128
    buffer_size: 512
    dtype: int16
  analysis: {}
  synthesis:
    output_buffer:
      dtype: float32
  spatial_audio:
    nfft: 512
    sampling_frequency: 8000
    # nova, rook, tank, pixel, zed — spread wide, they talk at once. The sixth channel is the game's own
    # output: already mixed for headphones, so it is marked diotic and its angles are never read.
    initial_azimuth: [0.0, -35.0, 35.0, -70.0, 70.0, 0.0]
    initial_elevation: [10.0, 10.0, 10.0, 10.0, 10.0, 0.0]
    diotic: [false, false, false, false, false, true]
    hrtf:
      dtype: complex64
      nfft: 512
      sampling_frequency: 8000
      path: ../spatial-audio/hrtf/hrtf_16khz_low_res.bin
      equalization: true
      gain_db: 3.0
    azimuth:
      symmetric: True
      span: 90
      resolution: 10
    elevation:
      span: 30
      resolution: 10
input: # Input configuration for DemoActivator
  source: file
  path: gaming_input.wav # generated by scripts/create_input.py scripts/gaming.yaml
output:
  destination: speaker
  dtype: int16 # Assuming float32 output from the system
  channel_shape: [2] # Stereo output for binaural audio
