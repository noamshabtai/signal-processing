demo:
  initial_gain_db: [-5.0, -5.0, -5.0, -5.0, -5.0, 0.0]
  azimuth_span: 180
  elevation_span: 90
  slider_resolution: 1
system:
  input_buffer:
    channel_shape: [6]
    step_size: 128
    buffer_size: 512
    dtype: int16
  analysis: {}
  synthesis:
    output_buffer:
      dtype: float32
  spatial_audio:
    nfft: 512
    sampling_frequency: 16000
    initial_azimuth: [0.0, -20.0, 20.0, -40.0, 40.0, 0.0]
    initial_elevation: [-5.0, -3.0, 0.0, 3.0, 5.0, 0.0]
    hrtf:
      dtype: complex64
      gain_db: 3.0
  early_reflections:
    delays_ms: [11.0, 17.0, 23.0, 29.0, 37.0, 43.0]
    gains_db: [-6.0, -7.5, -9.0, -10.5, -12.0, -13.5]
    azimuth: [-135.0, 135.0, -45.0, 45.0, 0.0, 180.0]
    elevation: [0.0, 0.0, 0.0, 0.0, 60.0, -30.0]
  reverb:
    rt60: 0.7
    wet: 0.2
input:
  source: file
  path: gaming_input.wav
output:
  destination: speaker
  dtype: int16
  channel_shape: [2]
