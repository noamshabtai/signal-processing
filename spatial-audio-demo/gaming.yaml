demo:
  initial_gain_db: [-5.0, -5.0, -5.0, -5.0, -5.0, 0.0]
system:
  input_buffer:
    channel_shape: [6]
    step_size: 128
    buffer_size: 512
    dtype: int16
  analysis: {}
  synthesis:
    output_buffer:
      dtype: float32
  spatial_audio:
    nfft: 512
    sampling_frequency: 16000
    initial_azimuth: [0.0, -20.0, 20.0, -40.0, 40.0, 0.0]
    initial_elevation: [-5.0, -3.0, 0.0, 3.0, 5.0, 0.0]
    hrtf:
      dtype: complex64
      gain_db: 3.0
    azimuth:
      symmetric: True
      span: 180
      resolution: 1
    elevation:
      span: 90
      resolution: 1
input:
  source: file
  path: gaming_input.wav
output:
  destination: speaker
  dtype: int16
  channel_shape: [2]
