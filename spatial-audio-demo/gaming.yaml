demo:
  initial_gain_db: [-5.0, -5.0, -5.0, -5.0, -5.0, 0.0]
system:
  input_buffer:
    channel_shape: [6]
    step_size: 128
    buffer_size: 512
    dtype: int16
  analysis: {}
  synthesis:
    output_buffer:
      dtype: float32
  spatial_audio:
    nfft: 512
    sampling_frequency: 8000
    initial_azimuth: [0.0, -20.0, 20.0, -40.0, 40.0, 0.0]
    initial_elevation: [10.0, 10.0, 10.0, 10.0, 10.0, 0.0]
    hrtf:
      dtype: complex64
      nfft: 512
      sampling_frequency: 8000
      path: ../spatial-audio/hrtf/hrtf_16khz_low_res.bin
      equalization: true
      gain_db: 3.0
    azimuth:
      symmetric: True
      span: 90
      resolution: 10
    elevation:
      span: 30
      resolution: 10
input:
  source: file
  path: gaming_input.wav
output:
  destination: speaker
  dtype: int16
  channel_shape: [2]
