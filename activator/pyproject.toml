[project]
name = "activator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.0",
    "system",
]

[project.optional-dependencies]
audio = [
    "audio-io",
    "pyaudio>=0.2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "activator[audio]",
    "io-for-tests",
    "parametrize-tests",
    "pytest>=8.3.4",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.1",
]

[tool.uv.sources]
io-for-tests = { path = "../io-for-tests", editable = true }
parametrize-tests = { path = "../parametrize-tests", editable = true }
system = { path = "../system", editable = true }
audio-io = { path = "../audio-io", editable = true }

[tool.setuptools.packages.find]
exclude = ["output*"]
